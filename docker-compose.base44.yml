services:
  web:
    image: node:16
    working_dir: /app
    volumes:
      - .:/app
      - /app/node_modules
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=development
      # Next.js auto-loads .env.development (committed demo credentials for the
      # public builder-io-demo Shopify store + Builder.io space), so the app
      # boots without any user-supplied secrets.
      - BASE44_PUBLIC_HOST_SUFFIX
      - BASE44_SANDBOX_HOST_DOMAIN
    command: ["sh", "-ec", "npm ci && exec npx next dev -H 0.0.0.0 -p 3000"]
    restart: on-failure
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000',r=>process.exit(r.statusCode<500?0:1)).on('error',()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      start_period: 120s
      retries: 5
